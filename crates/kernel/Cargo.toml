[package]
name = "kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kernel"
path = "src/main.rs"

[dependencies]
hal = { path = "../hal" }
xv6-fs-layout = { path = "../xv6-fs-layout" }
# TCP/IP stack (todo 16 Tier 7 — the sanctioned "no external crates"
# rule lift). no_std, no alloc requirement beyond what we provide.
smoltcp = { version = "0.12", default-features = false, features = [
    "medium-ethernet",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
    "alloc",
    "async",
] }

[target.'cfg(target_arch = "riscv64")'.dependencies]
hal-riscv64 = { path = "../hal-riscv64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-aarch64 = { path = "../hal-aarch64" }
